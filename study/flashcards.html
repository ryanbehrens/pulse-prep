<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d16">
<title>Flashcards · Pulse Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<style>
  .deckbar { display: flex; justify-content: space-between; align-items: center; margin: 14px 2px 8px; font-size: 13px; color: var(--mute); }
  .stage { perspective: 1400px; margin-top: 8px; height: min(380px, calc(100vh - 415px)); min-height: 230px; position: relative; touch-action: pan-y; }
  .fc { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
  .fc.flip { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; padding: 22px 20px;
    display: flex; flex-direction: column; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .front { background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--c) 28%, transparent), transparent 55%), linear-gradient(160deg, #15283f, #0c1828); }
  .back { transform: rotateY(180deg); background: linear-gradient(160deg, #0f2236, #0a1522); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
  .face .q { font-size: 22px; font-weight: 750; line-height: 1.3; margin: auto 0; }
  .face .a { font-size: 17px; line-height: 1.5; margin: auto 0; color: #dbe6ef; }
  .face .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--mute); }
  .hint { text-align: center; color: var(--mute); font-size: 12.5px; margin-top: 12px; }
  .rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .rate .again { color: var(--bad); border-color: rgba(255,107,107,.35); }
  .rate .got { color: var(--good); border-color: rgba(61,220,151,.35); }
  .fly-l { transform: translateX(-130%) rotate(-14deg) !important; opacity: 0; transition: transform .35s ease, opacity .35s; }
  .fly-r { transform: translateX(130%) rotate(14deg) !important; opacity: 0; transition: transform .35s ease, opacity .35s; }
  .done { text-align: center; padding: 34px 10px; }
  .done h2 { font-size: 24px; margin-top: 10px; }
</style>
</head>
<body data-root="../" data-tab="study">
<main class="page">
  <div class="page-head"><h1>Flashcards</h1></div>
  <div class="chips" id="decks" style="margin-top:12px"></div>
  <div id="play">
    <div class="deckbar"><span id="count"></span><span id="boxinfo"></span></div>
    <div class="bar"><i id="prog" style="width:0"></i></div>
    <div class="stage" id="stage"></div>
    <div class="rate"><button class="btn again" id="again">Again</button><button class="btn got" id="got">Got it</button></div>
    <p class="hint">Tap the card to flip · swipe right if you knew it, left to see it again</p>
  </div>
  <div class="card done" id="done" hidden></div>
</main>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../data/flashcards.js"></script>
<script>
  let deck = UI.qs('c') || 'all', queue = [], i = 0, known = 0;
  const decks = [['all', 'All'], ...APP.categories.map(c => [c.id, c.name])].filter(([id]) => id === 'all' || DATA.flashcards.some(f => f.cat === id));
  const dEl = document.getElementById('decks');
  dEl.innerHTML = decks.map(([id, n]) => `<button class="chip ${id === deck ? 'on' : ''}" data-d="${id}">${UI.esc(n)}</button>`).join('');
  dEl.onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; deck = b.dataset.d; dEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); start(); };

  function start() {
    // least-known cards first (lower Leitner box), shuffled within each box
    queue = DATA.flashcards.filter(f => deck === 'all' || f.cat === deck)
      .map(f => ({ f, k: Store.cardBox(f.id) + Math.random() })).sort((a, b) => a.k - b.k).map(x => x.f);
    i = 0; known = 0;
    document.getElementById('play').hidden = false; document.getElementById('done').hidden = true;
    show();
  }
  function show() {
    const stage = document.getElementById('stage');
    if (i >= queue.length) return finish();
    const f = queue[i], c = UI.cat(f.cat);
    document.getElementById('count').textContent = `Card ${i + 1} of ${queue.length}`;
    const box = Store.cardBox(f.id);
    document.getElementById('boxinfo').textContent = box >= 4 ? 'Mastered' : `Level ${box}/4`;
    document.getElementById('prog').style.width = (100 * i / queue.length) + '%';
    stage.innerHTML = `<div class="fc rise" style="--c:${c.color}">
      <div class="face front"><span class="badge" style="background:${c.color}22;color:${c.color};align-self:flex-start">${UI.esc(c.name)}</span>
        <div class="q">${UI.esc(f.front)}</div><div class="foot"><span>Tap to flip</span>${f.status === 'draft' ? '<span class="badge draft">Draft</span>' : ''}</div></div>
      <div class="face back"><span class="badge" style="align-self:flex-start">Answer</span><div class="a">${UI.esc(f.back)}</div>
        <div class="foot"><span>${UI.esc(f.source || '')}</span></div></div></div>`;
    const card = stage.firstElementChild;
    card.onclick = () => card.classList.toggle('flip');
    // swipe
    let sx = null, dx = 0;
    card.addEventListener('pointerdown', e => { sx = e.clientX; dx = 0; });
    card.addEventListener('pointermove', e => { if (sx === null) return; dx = e.clientX - sx; if (Math.abs(dx) > 8) card.style.transform = `${card.classList.contains('flip') ? 'rotateY(180deg) ' : ''}translateX(${dx}px) rotate(${dx / 25}deg)`; });
    card.addEventListener('pointerup', () => { if (sx === null) return; sx = null; card.style.transform = ''; if (dx > 90) rate(true); else if (dx < -90) rate(false); });
  }
  function rate(k) {
    const f = queue[i]; if (!f) return;
    Store.rateCard(f.id, k); if (k) known++;
    const card = document.querySelector('.fc'); card.classList.add(k ? 'fly-r' : 'fly-l');
    if (!k) queue.push(f);           // missed cards come back later in this session
    i++; setTimeout(show, 260);
    document.getElementById('streak-n').textContent = Store.streak();
  }
  function finish() {
    document.getElementById('play').hidden = true;
    const d = document.getElementById('done'); d.hidden = false;
    d.innerHTML = `<div class="icon-bubble" style="margin:auto;background:rgba(61,220,151,.15);color:var(--good)">${UI.icon('check')}</div>
      <h2>Deck complete!</h2><p class="muted">You knew ${known} card${known === 1 ? '' : 's'} on the first try or after review.</p>
      <div style="display:grid;gap:10px;margin-top:16px"><button class="btn primary" onclick="start()">Go again</button><a class="btn" href="quiz.html${deck !== 'all' ? '?c=' + deck : ''}">Take a quiz</a></div>`;
    UI.confetti();
  }
  document.getElementById('again').onclick = () => rate(false);
  document.getElementById('got').onclick = () => rate(true);
  start();
</script>
</body>
</html>
