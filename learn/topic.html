<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d16">
<title>Topic · Pulse Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<style>
  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--mute); font-size: 14px; margin-top: 14px; }
  .back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
  .hero { margin-top: 10px; padding: 20px 18px; border-radius: 22px; border: 1px solid var(--line);
    background: radial-gradient(120% 120% at 100% 0%, color-mix(in srgb, var(--c) 30%, transparent), transparent 60%), var(--glass); }
  .hero .icon-bubble { background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); }
  .hero h1 { font-size: 23px; font-weight: 800; margin-top: 12px; }
  .hero p { color: #c3d1de; margin: 6px 0 0; }
  .points { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .points li { display: flex; gap: 10px; align-items: flex-start; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; font-size: 14px; }
  .points li::before { content: ''; flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .src a { color: var(--accent); }
</style>
</head>
<body data-root="../" data-tab="learn">
<main class="page" id="main"></main>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../data/topics.js"></script>
<script src="../data/flashcards.js"></script>
<script src="../data/questions.js"></script>
<script>
  const id = UI.qs('c') || 'exam';
  const t = DATA.topics[id] || {};
  const c = UI.cat(id) || { name: t.title, color: '#3fd0ff', icon: 'learn', range: null };
  document.title = `${c.name} · ${APP.name}`;
  const nCards = DATA.flashcards.filter(f => f.cat === id).length, nQ = DATA.questions.filter(q => q.cat === id).length;
  document.getElementById('main').style.setProperty('--c', c.color);
  document.getElementById('main').innerHTML = `
    <a class="back" href="./">${UI.icon('back')}Learn</a>
    <div class="hero rise"><span class="icon-bubble">${UI.icon(c.icon)}</span>
      <h1>${UI.esc(c.name)}</h1>
      ${t.summary ? `<p>${UI.esc(t.summary)}</p>` : ''}
      <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
        ${c.range ? `<span class="badge">${c.range[0]}–${c.range[1]}% of the exam</span>` : ''}
        ${t.status === 'draft' ? '<span class="badge draft">Draft: awaiting expert review</span>' : ''}
      </div></div>
    <div class="section"><div class="section-title"><h2>${id === 'exam' ? 'Key facts' : 'What it covers'}</h2></div>
      <ul class="points">${(t.points || []).map(p => `<li class="rise">${UI.esc(p)}</li>`).join('')}</ul></div>
    ${id !== 'exam' ? `<div class="section"><div class="section-title"><h2>Practice this topic</h2></div>
      <div class="actions"><a class="btn" href="../study/flashcards.html?c=${id}">${nCards} flashcards</a><a class="btn primary" href="../study/quiz.html?c=${id}">Quiz · ${nQ} Qs</a></div></div>` : ''}
    ${(t.sources || []).length ? `<div class="section src small muted">Sources: ${t.sources.map(s => `<a href="${s.url}">${UI.esc(s.title)}</a>`).join(', ')}</div>` : ''}`;
</script>
</body>
</html>
