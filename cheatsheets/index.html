<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d16">
<title>Cheat sheets · Pulse Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<style>
  .sheets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .sh { border-radius: 20px; padding: 16px 14px; min-height: 118px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
    background: radial-gradient(120% 100% at 100% 0%, color-mix(in srgb, var(--c) 26%, transparent), transparent 60%), var(--glass);
    border: 1px solid var(--line); transition: transform .15s; text-align: left; }
  .sh:active { transform: scale(.96); }
  .sh .icon-bubble { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
  .sh h3 { font-size: 15px; margin-top: 12px; }
  .sh p { margin: 2px 0 0; font-size: 12px; color: var(--mute); }
  /* sheet view */
  .view { position: fixed; inset: 0; z-index: 40; overflow: auto; background: var(--bg-1); padding: calc(14px + env(safe-area-inset-top)) 16px 120px; animation: rise .35s ease both; }
  .view .inner { max-width: 640px; margin: 0 auto; }
  .close { display: inline-flex; align-items: center; gap: 4px; color: var(--mute); font-size: 14px; background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
  .vh { display: flex; align-items: center; gap: 12px; margin: 10px 0 16px; }
  .vh .icon-bubble { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
  .vh h1 { font-size: 23px; font-weight: 800; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); font-weight: 700; padding: 8px 10px; }
  td { padding: 10px; border-top: 1px solid var(--line); }
  td:first-child { font-weight: 600; }
  .formula .name { font-size: 12px; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .05em; }
  .formula .expr { font-size: 18px; font-weight: 750; margin-top: 6px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  .tip { border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 8%, transparent); }
  .calc { border-color: color-mix(in srgb, var(--c) 45%, transparent); }
  .calc h3 { display: flex; align-items: center; gap: 8px; }
  .calc h3 svg { width: 18px; height: 18px; fill: none; stroke: var(--c); stroke-width: 2; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .fields label { font-size: 12px; color: var(--mute); display: grid; gap: 4px; }
  .fields input, .fields select { font: inherit; font-size: 16px; color: var(--ink); background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
  .out { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,.25); font-size: 15px; }
  .out b { font-size: 22px; color: var(--c); }
</style>
</head>
<body data-root="../" data-tab="cheats">
<main class="page">
  <div class="page-head rise"><h1>Cheat sheets</h1><p>Quick visual references and calculators for the numbers nurses use most.</p></div>
  <div class="sheets" id="sheets"></div>
  <p class="small muted" style="margin-top:16px">Reference ranges vary between labs and textbooks. Always follow your program's and facility's values.</p>
</main>
<div class="view" id="view" hidden></div>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="../data/cheatsheets.js"></script>
<script src="calculators.js"></script>
<script>
  const list = document.getElementById('sheets');
  list.innerHTML = DATA.cheatsheets.map((s, i) => `<button class="sh rise" data-id="${s.id}" style="--c:${s.color};animation-delay:${i * .04}s">
    <span class="icon-bubble">${UI.icon(s.icon)}</span><div><h3>${UI.esc(s.title)}</h3><p>${UI.esc(UI.cat(s.cat)?.name || '')}</p></div></button>`).join('');
  list.onclick = e => { const b = e.target.closest('[data-id]'); if (b) open(b.dataset.id); };

  function block(b) {
    if (b.type === 'table') return `<div class="card" style="padding:6px 4px"><table><thead><tr>${b.head.map(h => `<th>${UI.esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${UI.esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if (b.type === 'formula') return `<div class="card formula"><div class="name">${UI.esc(b.name)}</div><div class="expr">${UI.esc(b.expr)}</div>${b.note ? `<p>${UI.esc(b.note)}</p>` : ''}</div>`;
    if (b.type === 'tip') return `<div class="card tip"><p style="color:var(--ink)">${UI.esc(b.text)}</p></div>`;
    if (b.type === 'calc') return `<div class="card calc" data-calc="${b.calc}"></div>`;
    return '';
  }
  function open(id) {
    const s = DATA.cheatsheets.find(x => x.id === id), v = document.getElementById('view');
    v.style.setProperty('--c', s.color);
    v.innerHTML = `<div class="inner"><button class="close" id="close">${UI.icon('back')}Cheat sheets</button>
      <div class="vh"><span class="icon-bubble">${UI.icon(s.icon)}</span><div><h1>${UI.esc(s.title)}</h1>${s.status === 'draft' ? '<span class="badge draft">Draft: awaiting expert review</span>' : ''}</div></div>
      <div class="stack">${s.blocks.map(block).join('')}</div>
      <p class="small muted" style="margin-top:16px">Sources: ${(s.sources || []).map(x => `<a style="color:var(--accent)" href="${x.url}">${UI.esc(x.title)}</a>`).join(', ')}</p></div>`;
    v.hidden = false; document.body.style.overflow = 'hidden';
    v.querySelectorAll('[data-calc]').forEach(el => Calculators[el.dataset.calc]?.(el));
    document.getElementById('close').onclick = () => { v.hidden = true; document.body.style.overflow = ''; history.replaceState(null, '', location.pathname); };
    history.replaceState(null, '', '#' + id);
    Store.markStudied();
  }
  if (location.hash.length > 1) open(location.hash.slice(1));
</script>
</body>
</html>
